# Crawl4AI worker configuration for the Ciele Website Source crawler.
#
# This file is mounted read-only at /app/config.yml and COMPLETELY replaces the
# image default, so it is kept as a full config. It is a copy of the pinned
# image's default (unclecode/crawl4ai:0.9.1) with only the changes noted inline
# with "Ciele:" — everything else is upstream default and must stay complete for
# the server to boot.
#
# The worker exposes only what the Ciele adapter (apps/web/src/lib/runtime/
# crawl4ai.ts) calls: POST /crawl/job, GET /crawl/job/{task_id}, and the public
# GET /health. Authentication is the static operator token (CRAWL4AI_API_TOKEN),
# enforced fail-closed on every route except /health and /token by the image's
# AuthGateMiddleware. Hooks / arbitrary JS execution stay disabled via
# CRAWL4AI_HOOKS_ENABLED=false (the default; set explicitly in deployment).

# Application Configuration
app:
  title: "Crawl4AI API"
  version: "1.0.0"
  # Ciele: bind 0.0.0.0 so the managed container / Docker network can reach the
  # server. A non-loopback bind makes the image's startup auth guard REFUSE to
  # start unless CRAWL4AI_API_TOKEN (or JWT) is set — which is exactly what we
  # want: no token, no boot.
  host: "0.0.0.0"
  port: 11235
  reload: False
  workers: 1
  timeout_keep_alive: 300

# Default LLM Configuration
# Ciele owns all enrichment/Concepts/embeddings; no LLM extraction runs here.
# This provider is only a default for LLM endpoints we never call.
llm:
  provider: "openai/gpt-4o-mini"
  # api_key: sk-...  # If you pass the API key directly (not recommended)

# Redis Configuration
# The image bundles a local Redis (managed by supervisord) that backs the async
# job queue for /crawl/job. task_ttl_seconds expires stored task results so
# memory does not grow unbounded between polls.
redis:
  host: "localhost"
  port: 6379
  db: 0
  password: ""
  task_ttl_seconds: 3600  # TTL for task data (1 hour default)
  ssl: False
  ssl_cert_reqs: None
  ssl_ca_certs: None
  ssl_certfile: None
  ssl_keyfile: None

# Resource governance (DoS protection). Any limit set to 0 means "unbounded".
limits:
  max_body_bytes: 10485760  # 10 MiB request body cap (413 if exceeded)
  max_pages: 50             # Ciele: match the product page budget (MAX_CRAWL_PAGES); defense in depth beyond the adapter clamp
  max_depth: 5              # deep-crawl depth clamp (matches the adapter's MAX_CRAWL_DEPTH)
  wall_clock_s: 600         # Ciele: 10 min per-crawl deadline (504) so a stuck crawl cannot run forever
  queue:                    # background job queue for /crawl/job
    maxsize: 1000           # max queued jobs (503 when full)
    workers: 2              # Ciele: low concurrency for a small pilot — bound browser fan-out
    per_principal: 4        # Ciele: max concurrent jobs per caller (429 over cap)

# Rate Limiting Configuration
rate_limiting:
  enabled: True
  default_limit: "1000/minute"
  trusted_proxies: []
  storage_uri: "redis://localhost:6379"  # Ciele: durable rate-limit store (the bundled Redis), per upstream production guidance

# Security Configuration
# Ciele: auth is the static operator token. jwt_enabled stays false — the Ciele
# adapter sends a static `Authorization: Bearer <CRAWL4AI_API_TOKEN>`, which the
# AuthGateMiddleware constant-time-compares and grants admin scope. The token
# itself is injected at runtime via the CRAWL4AI_API_TOKEN env var, never here.
security:
  enabled: true
  jwt_enabled: false
  api_token: ""  # left empty: the token comes from the CRAWL4AI_API_TOKEN env var at runtime, never committed here
  https_redirect: false  # TLS is terminated by the managed platform / ingress in front of the worker
  # trusted_hosts is the Host-header allowlist. For a private managed service you
  # may pin this to the service hostname (e.g. ["crawl4ai-worker-xxxx.run.app"]).
  # Left permissive for local Docker; tighten in the managed deployment.
  trusted_hosts: ["*"]
  cors_allow_origins: []  # deny-by-default; the worker is server-to-server only, no browser origins
  headers:
    x_content_type_options: "nosniff"
    x_frame_options: "DENY"
    content_security_policy: "default-src 'self'"
    strict_transport_security: "max-age=63072000; includeSubDomains"

# Crawler Configuration
crawler:
  base_config:
    simulate_user: true
  memory_threshold_percent: 95.0
  rate_limiter:
    enabled: true
    base_delay: [1.0, 2.0]
  timeouts:
    stream_init: 30.0
    batch_process: 300.0
  pool:
    max_pages: 8            # Ciele: cap concurrent browser pages for a ~4 GiB pilot (upstream default 40 is sized for far more RAM)
    idle_ttl_sec: 300
  browser:
    kwargs:
      headless: true
      text_mode: true
    extra_args:
      # --no-sandbox is required because the container runs as a non-root user
      # without a usable Chromium sandbox. See the runbook's hardening note for
      # how to remove it (user namespace / seccomp profile).
      - "--no-sandbox"
      - "--disable-dev-shm-usage"
      - "--disable-gpu"
      - "--disable-software-rasterizer"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Observability Configuration
observability:
  prometheus:
    enabled: True
    endpoint: "/metrics"
  health_check:
    endpoint: "/health"

# Webhook Configuration
# Ciele: disabled. The integration completes via the adapter's polling of
# GET /crawl/job/{task_id} (a signed webhook may be added later as an
# acceleration path, but never as the sole completion mechanism).
webhooks:
  enabled: false
  default_url: null
  data_in_payload: false
  retry:
    max_attempts: 5
    initial_delay_ms: 1000
    max_delay_ms: 32000
    timeout_ms: 30000
  headers:
    User-Agent: "Crawl4AI-Webhook/1.0"
