# The heavy worker: the JavaScript-rendering crawler. An overlay, never used on
# its own, and off unless `.env` asks:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.workers.yml
#   CRAWL4AI_API_TOKEN=<openssl rand -hex 32>
#   CRAWL4AI_SECRET_KEY=<openssl rand -hex 32>
#
# or `./deploy/bootstrap.sh --workers`, which writes those lines for you.
#
# It lives here rather than behind a `workers` profile in docker-compose.yml
# because compose interpolates every service in a file before it filters by
# profile: the `:?` guards below would abort a default `docker compose up`,
# naming a credential for a container that was never going to start. (Which
# they did, for a month.) An overlay is the only way to keep both the loud
# refusal and a stack that boots without these values set.
#
# It carries credentials and is not reachable from outside the compose
# network. Budget ~4 GiB of RAM. Without it the app degrades rather than
# breaks: crawling falls back to the built-in fetch-based crawler.
#
# The file used to carry a second worker, the graph engine, removed with
# ADR-0025. The filename stays because existing installs list it.

services:
  crawl4ai:
    image: unclecode/crawl4ai:0.9.1
    restart: unless-stopped
    networks: [workers]
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?set CRAWL4AI_API_TOKEN to run the workers}
      SECRET_KEY: ${CRAWL4AI_SECRET_KEY:?set CRAWL4AI_SECRET_KEY to run the workers}
      CRAWL4AI_HOOKS_ENABLED: "false"
    volumes:
      - ../services/crawl4ai-worker/config/crawl4ai.config.yml:/app/config.yml:ro
    shm_size: "1gb"
    # Capabilities are left alone here: this one drives Chromium, whose
    # sandbox is already off (see the config), and dropping them is untested
    # against that. It still may not gain any it did not start with.
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 1.5

