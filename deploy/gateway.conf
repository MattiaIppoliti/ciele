# One origin for the three Supabase services Ciele talks to, so the app has a
# single SUPABASE_URL and the browser makes same-origin calls.
#
# This replaces Kong from the upstream Supabase compose. Kong additionally does
# key-auth (mapping the anon/service keys to consumers) and rate limiting;
# Ciele relies on neither: GoTrue and PostgREST verify the JWT in the
# Authorization/apikey header against JWT_SECRET themselves, and Postgres RLS
# is what actually scopes every row to an organization.
#
# No TLS here on purpose: terminate it in your own reverse proxy in front.

# Docker's embedded DNS follows containers when Compose recreates them. Static
# proxy_pass hosts are resolved only at nginx start and can retain a dead IP.
# Shared upstream zones also let nginx start before a service has a DNS record.
# `resolve` is available in open-source nginx from 1.27.3 onward.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

upstream ciele_auth {
    zone ciele_auth 64k;
    server auth:9999 resolve;
}

upstream ciele_rest {
    zone ciele_rest 64k;
    server rest:3000 resolve;
}

upstream ciele_storage {
    zone ciele_storage 64k;
    server storage:5000 resolve;
}

server {
    listen 8000;
    server_name _;

    # Uploads: knowledge originals go up to 50 MB (storage FILE_SIZE_LIMIT).
    client_max_body_size 50m;

    # Streaming chat responses must not be buffered into a single flush.
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /auth/v1/ {
        proxy_pass http://ciele_auth/;
    }

    location /rest/v1/ {
        proxy_pass http://ciele_rest/;
    }

    location /storage/v1/ {
        proxy_pass http://ciele_storage/;
    }

    # Anything else is not part of the surface Ciele uses.
    location / {
        return 404;
    }
}
