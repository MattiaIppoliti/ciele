# One origin for the three Supabase services Ciele talks to, so the app has a
# single SUPABASE_URL and the browser makes same-origin calls.
#
# This replaces Kong from the upstream Supabase compose. Kong additionally does
# key-auth (mapping the anon/service keys to consumers) and rate limiting;
# Ciele relies on neither — GoTrue and PostgREST verify the JWT in the
# Authorization/apikey header against JWT_SECRET themselves, and Postgres RLS
# is what actually scopes every row to an organization.
#
# No TLS here on purpose: terminate it in your own reverse proxy in front.

server {
    listen 8000;
    server_name _;

    # Uploads: knowledge originals go up to 50 MB (storage FILE_SIZE_LIMIT).
    client_max_body_size 50m;

    # Streaming chat responses must not be buffered into a single flush.
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /auth/v1/ {
        proxy_pass http://auth:9999/;
    }

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
    }

    location /storage/v1/ {
        proxy_pass http://storage:5000/;
    }

    # Anything else is not part of the surface Ciele uses.
    location / {
        return 404;
    }
}
