# Self-hosted Ciele (#440, spec #430).
#
#   ./deploy/bootstrap.sh          generate secrets, start, migrate, seed
#   docker compose up -d           thereafter
#
# Profiles (every service is in exactly one). `.env` sets
#   COMPOSE_PROFILES=db,migrate,app,cron
# so those four come up on a bare `docker compose up`:
#   db        Postgres + auth + data API + storage + the gateway
#   migrate   one-shot; applies pending migrations, then the app starts
#   app       the web app (admin console + widget runtime)
#   cron      the six scheduled jobs, no Vercel needed
# and this one stays off until you ask for it:
#   studio    the database admin UI, a standing privileged surface
#
# The heavy workers (graph + crawler, ~8 GiB RAM) are not a profile here: they
# live in docker-compose.workers.yml, an overlay, because their credential
# guards would abort a default `up` from inside this file. See that file.
#
# The database layer is the Supabase OSS stack trimmed to what Ciele uses:
# Postgres (with pgvector), GoTrue for auth, PostgREST for the data API, and
# storage-api for files. Realtime, Edge Functions, Analytics and the Kong
# gateway are not started, a small nginx does the one job Ciele needs from
# the gateway, routing /auth /rest /storage under a single origin so the app
# has one SUPABASE_URL.
#
# TLS is deliberately out of scope: put your own reverse proxy in front and
# terminate there. Nothing here is exposed beyond the ports below.

name: ciele

services:
  # ── db profile ────────────────────────────────────────────────────────────
  postgres:
    profiles: [db]
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./deploy/bootstrap.sh first}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?run ./deploy/bootstrap.sh first}
      JWT_EXP: 3600
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Gives the Supabase service roles the generated password on first
      # init; without it auth/rest/storage cannot log in. Mounted as ONE file
      # into the image's init-scripts subdirectory, never over the whole
      # /docker-entrypoint-initdb.d: the image bakes its own init there (the
      # postgres role, the auth.uid()/auth.role() helpers every RLS policy
      # calls, the supautils grants), and a directory mount would mask all of
      # it — Postgres then boots with no postgres role at all. The 99- prefix
      # sorts our password pass after the image's own scripts.
      # Must be a .sql file: the image's migrate.sh only executes *.sql here,
      # a .sh is silently skipped and the service roles never get passwords.
      - ./db-init/99-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-ciele-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  auth:
    profiles: [db]
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://supabase_auth_admin:${POSTGRES_PASSWORD}@postgres:5432/postgres
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL}/**
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      # Local-first default: no SMTP, so a self-hoster can sign up without
      # wiring mail. Set SMTP_* and flip this to require confirmation.
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-true}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      # GoTrue parses this into an int before checking whether SMTP is even
      # configured, and an empty string is a fatal parse error that crash-loops
      # the container. 25 is inert while SMTP_HOST is unset.
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-25}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_LOG_LEVEL: info

  rest:
    profiles: [db]
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgresql://authenticator:${POSTGRES_PASSWORD}@postgres:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  storage:
    profiles: [db]
    image: supabase/storage-api:v1.19.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY:?run ./deploy/bootstrap.sh first}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?run ./deploy/bootstrap.sh first}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://supabase_storage_admin:${POSTGRES_PASSWORD}@postgres:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      # Image transformations need imgproxy, which Ciele does not use.
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage

  # One origin for auth + rest + storage, the single job Ciele needs from a
  # gateway. Replaces Kong (which additionally does key-auth and rate
  # limiting Ciele does not rely on, PostgREST and GoTrue verify the JWT
  # themselves against JWT_SECRET).
  gateway:
    profiles: [db]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - storage
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${SUPABASE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/auth/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── migrate profile (one-shot) ────────────────────────────────────────────
  # The same filename-ledger applier CI runs against production, so a
  # self-host and the hosted deployment converge on one migration path.
  migrate:
    profiles: [migrate]
    build:
      context: ..
      dockerfile: deploy/migrate.Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      # Not required to be *healthy*, only running: the entrypoint waits for
      # the schemas these two install.
      auth:
        condition: service_started
      storage:
        condition: service_started
    environment:
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      # Migrations create the three storage buckets and reference auth.users,
      # so they must run after GoTrue and storage-api have installed their own
      # tables. Tables, not schemas: the postgres image's baked init creates
      # the `auth` schema at first boot, long before GoTrue has run its own
      # migrations, so a schema probe passes while auth.users does not exist
      # yet and the FK migrations fail. The entrypoint waits on to_regclass.
      WAIT_FOR_TABLES: "auth.users,storage.buckets"
      # `./deploy/bootstrap.sh --seed` sets this for the first run.
      LOAD_DEMO_SEED: ${LOAD_DEMO_SEED:-}

  # ── app profile ───────────────────────────────────────────────────────────
  app:
    profiles: [app]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined at build time, so the browser bundle needs
        # the public Supabase origin baked in.
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
      # The schema the app queries must exist before it serves a request.
      migrate:
        condition: service_completed_successfully
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?run ./deploy/bootstrap.sh first}
      APPLICATION_IMPORT_MAX_REMOTE_ITEMS: ${APPLICATION_IMPORT_MAX_REMOTE_ITEMS:-100000}
      APPLICATION_IMPORT_MAX_ORG_BYTES: ${APPLICATION_IMPORT_MAX_ORG_BYTES:-5368709120}
      APPLICATION_IMPORT_MAX_CONCURRENT: ${APPLICATION_IMPORT_MAX_CONCURRENT:-3}
      SLACK_APPLICATION_CLIENT_ID: ${SLACK_APPLICATION_CLIENT_ID:-}
      SLACK_APPLICATION_CLIENT_SECRET: ${SLACK_APPLICATION_CLIENT_SECRET:-}
      MICROSOFT_APPLICATION_CLIENT_ID: ${MICROSOFT_APPLICATION_CLIENT_ID:-}
      MICROSOFT_APPLICATION_CLIENT_SECRET: ${MICROSOFT_APPLICATION_CLIENT_SECRET:-}
      GOOGLE_APPLICATION_CLIENT_ID: ${GOOGLE_APPLICATION_CLIENT_ID:-}
      GOOGLE_APPLICATION_CLIENT_SECRET: ${GOOGLE_APPLICATION_CLIENT_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:?run ./deploy/bootstrap.sh first}
      PLATFORM_OWNER_EMAIL: ${PLATFORM_OWNER_EMAIL:-}
      # AI providers. Any one of these makes assistants answer; with none set
      # the app still runs on its deterministic keyword engine.
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_CHAT_MODEL: ${OPENAI_COMPATIBLE_CHAT_MODEL:-}
      OPENAI_COMPATIBLE_EMBEDDING_MODEL: ${OPENAI_COMPATIBLE_EMBEDDING_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      # The heavy workers, if the workers overlay is on. Empty means the
      # app uses its built-in retrieval and crawler instead.
      GRAPH_WORKER_BASE_URL: ${GRAPH_WORKER_BASE_URL:-}
      GRAPH_WORKER_API_TOKEN: ${GRAPH_WORKER_API_TOKEN:-}
      CRAWL4AI_BASE_URL: ${CRAWL4AI_BASE_URL:-}
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
    ports:
      - "${APP_PORT:-3000}:3000"

  # ── cron profile ──────────────────────────────────────────────────────────
  # Replaces Vercel Cron: the same five routes on the same schedules, called
  # with CRON_SECRET as a bearer token. Schedules live in cron/crontab.
  cron:
    profiles: [cron]
    build:
      context: ./cron
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET}

  # ── studio profile (opt-in, off by default) ───────────────────────────────
  # A database admin UI is a standing privileged surface; run it when you need
  # it, behind your own proxy, and stop it again.
  studio:
    profiles: [studio]
    image: supabase/studio:2025.06.30-sha-6f5982d
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: http://gateway:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DEFAULT_ORGANIZATION_NAME: Self-hosted
      DEFAULT_PROJECT_NAME: Ciele
    ports:
      - "${STUDIO_PORT:-8080}:3000"

  meta:
    profiles: [studio]
    image: supabase/postgres-meta:v0.91.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: postgres
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

volumes:
  postgres-data:
  storage-data:
